name: Supabase

on:
  pull_request:
    branches: [main]
    paths: &supabase_paths
      [
        "supabase/migrations/**",
        "supabase/tests/**",
        "supabase/seed.sql",
        "supabase/functions/**",
        "lib/supabase/database.types.ts",
        ".github/workflows/supabase.yml",
      ]
  push:
    branches: [main]
    paths: *supabase_paths

jobs:
  lint:
    name: Lint migrations
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.78.1

      - name: Link to Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Lint migrations
        run: supabase db lint --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Tenancy test harness (CWA-7 / #209). Runs entirely against an ephemeral
  # local Supabase stack: no `supabase link`, no Supabase secrets in env, so
  # it is safe for fork PRs and can never touch the remote project.
  pgtap:
    name: pgTAP tenancy harness (local only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.78.1

      - name: Start local database
        run: supabase db start

      # supabase/tests/site_settings_rls.sql predates pgTAP (plain SQL, no
      # TAP output) and would fail pg_prove; every other supabase/tests/*.sql
      # is discovered automatically so new suites can't be silently skipped.
      - name: Run pgTAP suite (local only — never --linked)
        run: |
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(find supabase/tests -name '*.sql' ! -name 'site_settings_rls.sql' -print0 | sort -z)
          echo "Running: ${files[*]}"
          supabase test db "${files[@]}"

      - name: Check generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code lib/supabase/database.types.ts

  # Edge function unit tests (CWA-10 / #212). Pure units against the
  # _shared/ modules — no network, no database.
  #
  # The two index.ts files are checked non-blocking (continue-on-error): they
  # import an unpinned https://esm.sh/@supabase/supabase-js@2, so a hard gate
  # would fail on third-party CDN drift rather than on our code. The only
  # blocking compile of those files is `supabase functions deploy` in the
  # migrate job below, which runs on push — i.e. POST-merge. A type error in
  # an index.ts therefore surfaces here as a PR annotation, and if ignored,
  # fails deploy after merge (blocking the migrations behind it in that job).
  # Pinning the esm.sh import would let this step become a real gate.
  deno-test:
    name: Edge function unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Type-check shared edge function modules
        run: deno check supabase/functions/_shared/*.ts

      - name: Run edge function unit tests
        run: deno test --allow-env supabase/functions/tests/

      # Non-blocking: see the note above. Annotates the PR instead of letting
      # a type error reach the post-merge deploy unseen.
      - name: Type-check edge function entry points (non-blocking)
        continue-on-error: true
        run: |
          deno check supabase/functions/send-event-reminders/index.ts \
                     supabase/functions/send-serving-reminders/index.ts

  migrate:
    name: Push migrations & dump schema
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supabase-migrate-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.78.1

      - name: Link to Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy edge functions
        run: supabase functions deploy send-event-reminders send-serving-reminders
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Dump schema
        run: supabase db dump --schema public -f supabase/schema.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Commit schema dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/schema.sql
          if git diff --staged --quiet; then
            echo "No schema changes to commit"
            exit 0
          fi
          git commit -m "chore(db): update schema dump [skip ci]"
          git fetch origin main
          git pull --rebase origin main
          pushed=false
          for i in 1 2 3; do
            if git push; then
              pushed=true
              break
            fi
            echo "Push failed (attempt $i), rebasing and retrying..."
            sleep $((i * 2))
            git pull --rebase origin main
          done
          if [ "$pushed" = false ]; then
            echo "All push attempts failed"
            exit 1
          fi
