name: Semgrep

# Only scan changes that touch files the scan can act on. Later patterns
# override earlier ones. .github/ is not excluded — semgrep's auto config
# includes GitHub Actions security rules.
on:
  push:
    branches:
      - main
    paths: &semgrep_paths
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!LICENSE'
      - '!.claude/**'
      - '!.agents/**'
      - '!.archon/**'
      - '!.zap/**'
      - '!.coderabbit.yaml'
      - '!renovate.json5'
      - '!.releaserc.json'
      - '!.gitignore'
      - '!.env.example'
  pull_request:
    branches:
      - main
    paths: *semgrep_paths

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  semgrep:
    uses: krypsis-io/.github/.github/workflows/semgrep.yml@main
